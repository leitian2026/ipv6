name: Mirror proxyip

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
      - name: Copy source files
        run: |
          cp .github/workflows/mirror-source.yml /tmp/mirror-source.yml
          git clone https://github.com/leitian2026/proxyip.git source
          (cd source && tar --exclude=.git -cf - .) | tar -xf -
          cp /tmp/mirror-source.yml .github/workflows/mirror-source.yml
          rm -rf source
          rm -f mirror-trigger.txt mirror-trigger-2.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '完整复制 proxyip 源码' || true
          git push
